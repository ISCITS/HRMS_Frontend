services:
  backend:
    # The backend service handles HTTP requests and talks to PostgreSQL and Redis over the internal network.
    build:
      context: .
    container_name: hrms-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
      - "5678:5678"
    volumes:
      # Source is mounted into the container so uvicorn reload can see local code changes during debugging.
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - postgres
      - redis

  postgres:
    # PostgreSQL persists application data for repository operations.
    image: postgres:16
    container_name: hrms-postgres
    environment:
      POSTGRES_DB: hrms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    # Redis stores optional cached responses when caching is enabled.
    image: redis:7
    container_name: hrms-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  # Named volumes preserve database and cache state across container restarts.
  postgres_data:
  redis_data:
