services:
  backend:
    # The backend service runs from the prebuilt Python 3.12 dependency image.
    image: iscuser1/rps-api-python312-deps:latest
    container_name: hrms-backend
    working_dir: /workspace
    env_file:
      - .env
    ports:
      - "8000:8000"
      - "5678:5678"
    volumes:
      # Source is mounted so code runs directly from the local checkout without local dependency installs.
      - .:/workspace
    environment:
      - PYTHONUNBUFFERED=1
    command: ["python", "-m", "app.StartServer"]
    depends_on:
      - postgres
      - redis

  postgres:
    # PostgreSQL persists application data for repository operations.
    image: postgres:16
    container_name: hrms-postgres
    environment:
      POSTGRES_DB: hrms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    # Redis stores optional cached responses when caching is enabled.
    image: redis:7
    container_name: hrms-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  # Named volumes preserve database and cache state across container restarts.
  postgres_data:
  redis_data:
