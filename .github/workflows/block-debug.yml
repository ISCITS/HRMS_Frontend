name: block-debug

on:
  pull_request:
  push:
    branches:
      - testing

jobs:
  block-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Set up Python for secret scan
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --upgrade pip
          pip install detect-secrets

      - name: Scan for forbidden patterns
        shell: bash
        run: |
          echo "Scanning for forbidden patterns in Next.js files..."

          FAILED=0

          while IFS= read -r match; do
            [ -z "$match" ] && continue

            FILE=$(echo "$match" | cut -d: -f1)
            LINE=$(echo "$match" | cut -d: -f2)
            TEXT=$(echo "$match" | cut -d: -f3-)

            ISSUE="Forbidden pattern found"

            if echo "$TEXT" | grep -qE '\bconsole\.log\s*\('; then
              ISSUE="console.log detected"
            elif echo "$TEXT" | grep -qE '\bconsole\.debug\s*\('; then
              ISSUE="console.debug detected"
            elif echo "$TEXT" | grep -qE '\bdebugger\b'; then
              ISSUE="debugger detected"
            elif echo "$TEXT" | grep -qE '\balert\s*\('; then
              ISSUE="alert() detected"
            elif echo "$TEXT" | grep -qE '^[[:space:]]*catch[[:space:]]*\([^)]+\)[[:space:]]*\{?[[:space:]]*$'; then
              ISSUE="catch block found - review error handling"
            fi

            echo "::error file=$FILE,line=$LINE::$FILE:$LINE $ISSUE -> $TEXT"
            FAILED=1
          done < <(
            grep -RInE '\bconsole\.log\s*\(|\bconsole\.debug\s*\(|\bdebugger\b|\balert\s*\(|^[[:space:]]*catch[[:space:]]*\([^)]+\)[[:space:]]*\{?[[:space:]]*$' . \
              --include='*.js' \
              --include='*.jsx' \
              --include='*.ts' \
              --include='*.tsx' \
              --exclude-dir=.git \
              --exclude-dir=.github \
              --exclude-dir=node_modules \
              --exclude-dir=.next \
              --exclude-dir=out \
              --exclude-dir=coverage \
              --exclude-dir=dist \
              --exclude-dir=build \
              --exclude='*.md' \
              --exclude='*.yml' \
              --exclude='*.yaml' || true
          )

          if [ "$FAILED" -ne 0 ]; then
            echo "Forbidden patterns detected."
            exit 1
          fi

          echo "No forbidden patterns found."

      - name: Run secret scan
        run: |
          echo "Scanning for secrets..."
          detect-secrets scan --all-files --disable-plugin KeywordDetector --exclude-files '^(\.git/|node_modules/|\.next/|out/|coverage/|build/|dist/|tsconfig\.tsbuildinfo$|.*\.tsbuildinfo$)' > .secrets.baseline

          python - <<'PY'
          import json
          import sys

          with open(".secrets.baseline", "r") as f:
              data = json.load(f)

          results = data.get("results", {})
          found = False

          for filename, secrets in results.items():
              for secret in secrets:
                  found = True
                  line_number = secret.get("line_number", 1)
                  secret_type = secret.get("type", "Unknown secret")
                  print(f"::error file={filename},line={line_number}::{filename}:{line_number} {secret_type} detected")

          if found:
              sys.exit(1)

          print("No secrets detected.")
          PY

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck (report-only — pre-existing errors tracked separately, not build-blocking yet)
        run: npm run typecheck || true

      - name: Run build
        run: npm run build

      - name: Audit dependencies (non-blocking)
        run: npm audit --audit-level=high || true
